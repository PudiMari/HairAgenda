<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8e936d", // Muted Olive Green
                        "accent": "#c58c73",  // Warm Terracotta
                        "background-light": "#fcfaf7",
                        "background-dark": "#2c2b28",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.75rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }</script>
<title>HairAgenda - Agendamento</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between border-b border-primary/10 bg-background-light dark:bg-background-dark px-6 py-4 sticky top-0 z-50">
<div class="flex items-center gap-3">
<div class="text-primary/80">
<span class="material-symbols-outlined text-3xl">content_cut</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight">HairAgenda</h2>
</div>
<div class="flex items-center gap-2">
<span class="text-xs font-medium text-slate-500 uppercase tracking-widest">Passo 1 de 2</span>
</div>
</header>
<main class="flex-1 max-w-2xl mx-auto w-full px-4 py-8">
<!-- Section A: Service Selection -->
<section class="mb-10">
<div class="flex items-center justify-between mb-6">
<h3 class="text-xl font-bold">O Quê (Serviço)</h3>
<span class="text-accent text-sm font-medium">Obrigatório</span>
</div>
<div class="grid gap-4">
<!-- Service Card Selected -->
<button class="flex items-center justify-between p-4 rounded-xl border-2 border-accent bg-accent/5 text-left transition-all">
<div class="flex flex-col gap-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Corte Feminino</p>
<p class="text-accent text-sm font-semibold uppercase tracking-tighter">R$ 120 • 45 min</p>
</div>
<span class="material-symbols-outlined text-accent">check_circle</span>
</button>
<!-- Service Card -->
<button class="flex items-center justify-between p-4 rounded-xl border border-primary/20 bg-white dark:bg-white/5 text-left hover:border-primary/50 transition-all">
<div class="flex flex-col gap-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Coloração</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium uppercase tracking-tighter">R$ 200 • 90 min</p>
</div>
<span class="material-symbols-outlined text-slate-300">radio_button_unchecked</span>
</button>
<!-- Service Card -->
<button class="flex items-center justify-between p-4 rounded-xl border border-primary/20 bg-white dark:bg-white/5 text-left hover:border-primary/50 transition-all">
<div class="flex flex-col gap-1">
<p class="font-bold text-slate-900 dark:text-slate-100">Escova</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium uppercase tracking-tighter">R$ 80 • 30 min</p>
</div>
<span class="material-symbols-outlined text-slate-300">radio_button_unchecked</span>
</button>
</div>
</section>
<hr class="border-primary/10 my-8"/>
<!-- Section B: Date and Time -->
<section class="mb-10">
<div class="flex items-center justify-between mb-6">
<h3 class="text-xl font-bold">Quando (Data e Hora)</h3>
</div>
<!-- Horizontal Datepicker -->
<div class="mb-8">
<p class="text-sm font-medium mb-3 text-slate-500 dark:text-slate-400">Próximos 15 dias</p>
<div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
<!-- Date Item Selected -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-primary text-white shadow-lg shadow-primary/20">
<span class="text-[10px] uppercase font-bold opacity-80">Hoje</span>
<span class="text-xl font-bold">24</span>
<span class="text-[10px] uppercase font-bold">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Sáb</span>
<span class="text-xl font-bold">25</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Dom</span>
<span class="text-xl font-bold text-slate-400">26</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Seg</span>
<span class="text-xl font-bold">27</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Ter</span>
<span class="text-xl font-bold">28</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Qua</span>
<span class="text-xl font-bold">29</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
<!-- Date Item -->
<button class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-20 rounded-xl bg-white dark:bg-white/5 border border-primary/10">
<span class="text-[10px] uppercase font-bold text-slate-400">Qui</span>
<span class="text-xl font-bold">30</span>
<span class="text-[10px] uppercase font-bold text-slate-400">Mai</span>
</button>
</div>
</div>
<!-- Time Slots Grid -->
<div>
<p class="text-sm font-medium mb-3 text-slate-500 dark:text-slate-400">Horários disponíveis</p>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">09:00</button>
<button class="py-3 rounded-lg border border-primary bg-primary text-white font-bold text-sm">10:00</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">11:30</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm opacity-30 cursor-not-allowed" disabled="">13:00</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">14:30</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">15:00</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">16:30</button>
<button class="py-3 rounded-lg border border-primary/20 bg-white dark:bg-white/5 font-bold text-sm hover:bg-primary/10">18:00</button>
</div>
</div>
</section>
<!-- Navigation Buttons -->
<div class="flex items-center gap-4 mt-12 mb-20">
<button class="flex-1 flex items-center justify-center gap-2 h-14 rounded-xl border border-primary/20 font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
<span class="material-symbols-outlined text-lg">arrow_back</span>
                        Voltar
                    </button>
<button class="flex-[2_2_0px] flex items-center justify-center gap-2 h-14 rounded-xl bg-accent text-white font-bold shadow-xl shadow-accent/20 hover:brightness-110 transition-all">
                        Avançar
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</main>
<!-- Sticky Summary (Mobile) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-primary/10 sm:hidden">
<div class="flex items-center justify-between max-w-2xl mx-auto">
<div>
<p class="text-[10px] uppercase font-bold text-slate-500">Resumo</p>
<p class="text-sm font-bold truncate">Corte Feminino • 10:00</p>
</div>
<div class="text-right">
<p class="text-accent font-bold">R$ 120,00</p>
</div>
</div>
</div>
</div>
</div>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
